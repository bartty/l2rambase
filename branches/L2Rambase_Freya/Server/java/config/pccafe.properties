#=============================================
# Pc Cafe
#=============================================
# Enable PcBangPoint
# Default: False
PcBangPointEnable = False

# Minimum level for PcBang Points
# Default: 40
PcBangPointMinLevel = 40

# Minimum PcBang Points
# Default: 100
PcBangPointMinCount = 20

# Maximum PcBangPoints
PcBangPointMaxCount = 100

# Chance to get points x2
# Default: 5
PcBangPointDualChance = 5

# Time of next change for give PcBang Points
# Time is in seconds
# Default: 3600 (1 hour)
PcBangPointTimeStamp = 3600

# PcBang Points to offline shops
# Default: False
PcBangOfflineShops = True

# PcBang Recharge offline shops
# Default: False
PcBangRechargeShops = True